<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPY STATION 🚀 - محطة الجاسوس</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  
  body { 
    background: #030712; 
    color: #f3f4f6; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    padding: 15px; 
    overflow-x: hidden;
    background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #030712 100%);
  }

  /* Space Logo Styling */
  .logo-container { margin-bottom: 20px; }
  .logo-title {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    letter-spacing: 2px;
  }
  .logo-subtitle { font-size: 12px; color: #94a3b8; letter-spacing: 4px; text-transform: uppercase; }

  .card { 
    background: rgba(17, 24, 39, 0.85); 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    backdrop-filter: blur(12px);
    border-radius: 24px; 
    padding: 28px; 
    width: 100%; 
    max-width: 520px; 
    text-align: center; 
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(56, 189, 248, 0.05);
  }

  input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; font-size: 15px; text-align: center; outline: none; transition: 0.3s; }
  input, select { background: #0b0f19; color: white; border: 1px solid #1f2937; }
  input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

  button { background: linear-gradient(135deg, #38bdf8, #3b82f6); color: #030712; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5); }
  
  .btn-google { background: #ffffff; color: #1f2937; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; margin-bottom: 12px; }
  .btn-google:hover { background: #f3f4f6; }

  .btn-secondary { background: #1f2937; color: white; box-shadow: none; }
  .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

  .divider { display: flex; align-items: center; text-align: center; color: #6b7280; font-size: 12px; margin: 12px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #1f2937; }
  .divider:not(:empty)::before { margin-left: .5em; }
  .divider:not(:empty)::after { margin-right: .5em; }

  .code-box { background: #0b0f19; color: #38bdf8; font-size: 30px; font-weight: bold; letter-spacing: 6px; padding: 12px; border-radius: 14px; border: 1px dashed #38bdf8; margin: 12px 0; }
  
  .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; max-height: 160px; overflow-y: auto; background: #0b0f19; padding: 10px; border-radius: 12px; }
  .player-item { background: #111827; padding: 8px 12px; border-radius: 8px; font-size: 14px; border: 1px solid #1f2937; display: flex; align-items: center; gap: 8px; }

  .word-box { background: linear-gradient(135deg, #1e1b4b, #312e81); border: 1px solid #6366f1; font-size: 24px; padding: 20px; border-radius: 16px; margin: 15px 0; font-weight: bold; white-space: pre-line; }
  .spy-box { background: linear-gradient(135deg, #450a0a, #7f1d1d); border-color: #ef4444; }

  .chat-box { background: #0b0f19; border-radius: 12px; border: 1px solid #1f2937; height: 130px; overflow-y: auto; padding: 10px; text-align: right; font-size: 13px; margin: 10px 0; display: flex; flex-direction: column; gap: 6px; }
  .chat-msg { background: #111827; padding: 6px 10px; border-radius: 8px; border: 1px solid #1f2937; }
  
  .vote-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
  .vote-btn { background: #111827; color: white; border: 1px solid #1f2937; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px; transition: 0.2s; }
  .vote-btn:hover { border-color: #ef4444; background: #1f2937; }
  
  .hidden { display: none; }
  .auth-toggle { color: #38bdf8; cursor: pointer; font-size: 13px; margin-top: 10px; text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <!-- اللوجو الفضائي -->
  <div class="logo-container">
    <div class="logo-title">🛸 SPY STATION</div>
    <div class="logo-subtitle">SPACE EDITION</div>
  </div>

  <!-- شاشة الحسابات الشاملة (Google + العادي) -->
  <div id="auth-screen">
    <!-- خيار Google -->
    <button class="btn-google" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 17C3.7 20.7 7.5 24 12 24z"/></svg>
      الدخول السريع بـ Google 🚀
    </button>

    <div class="divider">أو باستخدام البريد الإلكتروني</div>

    <!-- خيار التسجيل العادي -->
    <h4 id="auth-title" style="margin-bottom:8px;">تسجيل الدخول</h4>
    <input type="email" id="authEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="authPassword" placeholder="كلمة السر">
    <input type="text" id="authUsername" placeholder="اسمك داخل اللعبة (للحساب الجديد)" class="hidden">
    
    <button onclick="handleAuth()" id="authBtn">دخول 🚀</button>
    <div class="auth-toggle" onclick="toggleAuthMode()" id="authToggleText">ليس لديك حساب؟ أنشئ حساباً جديداً</div>
  </div>

  <!-- الشاشة الرئيسية بعد تسجيل الدخول -->
  <div id="main-menu" class="hidden">
    <p>أهلاً بك يا <b id="userDisplay" style="color:#38bdf8;">لاعب</b> 👨‍🚀</p>
    <button onclick="showCreateRoomOptions()">إنشاء غرفة جديدة 🛠️</button>
    <hr style="margin: 15px 0; border-color: #1f2937;">
    <input type="text" id="roomCodeInput" placeholder="كود الغرفة">
    <button class="btn-secondary" onclick="joinRoom()">دخول الغرفة 🛰️</button>
    <button class="btn-danger" style="margin-top:20px;" onclick="logout()">تسجيل الخروج</button>
  </div>

  <!-- خيارات وإعدادات الغرفة للـ Host -->
  <div id="create-room-screen" class="hidden">
    <h3>إعدادات الغرفة الفضائية ⚙️</h3>
    <label style="font-size:12px; color:#94a3b8;">اختر الفئة:</label>
    <select id="categorySelect">
      <option value="players">⚽ لاعيبين كرة</option>
      <option value="food">🍕 أكلات ومشروبات</option>
      <option value="places">🗺️ أماكن ومعالم</option>
      <option value="movies">🎬 أفلام ومسلسلات</option>
      <option value="anime">⛩️ أنمي وكرتون</option>
    </select>

    <label style="font-size:12px; color:#94a3b8;">عدد الجواسيس:</label>
    <select id="spyCountSelect">
      <option value="1">1 جاسوس</option>
      <option value="2">2 جاسوس</option>
      <option value="3">3 جواسيس</option>
    </select>

    <label style="font-size:12px; color:#94a3b8;">مدة الجولة (بالثواني):</label>
    <select id="timerSelect">
      <option value="60">60 ثانية</option>
      <option value="90">90 ثانية</option>
      <option value="120" selected>120 ثانية</option>
    </select>

    <button onclick="confirmCreateRoom()">تأكيد وإطلاق الغرفة 🚀</button>
    <button class="btn-secondary" onclick="backToMenu()">إلغاء</button>
  </div>

  <!-- شاشة الانتظار (Lobby) -->
  <div id="lobby-screen" class="hidden">
    <p>كود المحطة للإنضمام:</p>
    <div id="roomCodeDisplay" class="code-box">----</div>
    
    <div id="host-controls" class="hidden">
      <button onclick="startGame()">بدء الجولة الآن 🚀</button>
    </div>

    <div style="margin-top:12px;">
      <b>رواد الفضاء المتواجدين (<span id="playerCount">0</span> / 20):</b>
      <div id="playersContainer" class="player-grid"></div>
    </div>
  </div>

  <!-- شاشة اللعب والكلمة -->
  <div id="game-screen" class="hidden">
    <div id="timerDisplay" style="font-size:18px; color:#ef4444; font-weight:bold;">⏳ الوقت: --</div>
    <div id="roleDisplay" class="word-box">...</div>

    <!-- الشات والتلميحات -->
    <div class="chat-box" id="chatMessages"></div>
    <div style="display:flex; gap:5px;">
      <input type="text" id="chatInput" placeholder="اكتب تلميحك هنا..." style="margin:0;">
      <button style="width:30%; margin:0;" onclick="sendMessage()">إرسال</button>
    </div>

    <hr style="margin: 15px 0; border-color: #1f2937;">

    <h3>مركز التصويت وطرد الجاسوس 🗳️</h3>
    <div id="voteContainer" class="vote-grid"></div>
    <div id="gameResult" style="margin-top:10px; font-weight:bold; font-size: 16px;"></div>

    <button id="resetBtn" class="hidden btn-danger" style="margin-top:15px;" onclick="resetGame()">إعادة الجولة 🔄</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmOPqQ1AV9YEJ4wU7jjW9_kIy4Gbby8Zs",
  authDomain: "spy-game-4f727.firebaseapp.com",
  databaseURL: "https://spy-game-4f727-default-rtdb.firebaseio.com",
  projectId: "spy-game-4f727",
  storageBucket: "spy-game-4f727.firebasestorage.app",
  messagingSenderId: "567560688609",
  appId: "1:567560688609:web:9a85e21fcf318e888d78a0",
  measurementId: "G-TTFB8B3SBK"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const wordsDatabase = {
  players: ["محمد صلاح", "رونالدو", "ميسي", "مبابي", "بنزيما", "هالانج", "شيكابالا"],
  food: ["بيتزا", "كشري", "برجر", "ملوخية", "شاورما", "فول وطعمية"],
  places: ["الأهرامات", "برج القاهرة", "مكتبة الإسكندرية", "شرم الشيخ", "الأقصر"],
  movies: ["الفيل الأزرق", "ولاد رزق", "صعيدي في الجامعة الأمريكية", "كازابلانكا"],
  anime: ["ون بيس", "ناروتو", "هجوم العمالقة", "دراجون بول", "كونان"]
};

let currentUser = null;
let isSignUpMode = false;
let currentRoom = null;
let isHost = false;
let timerInterval = null;

// تبديل واجهة الحسابات
function toggleAuthMode() {
  isSignUpMode = !isSignUpMode;
  document.getElementById('auth-title').innerText = isSignUpMode ? "إنشاء حساب جديد" : "تسجيل الدخول";
  document.getElementById('authBtn').innerText = isSignUpMode ? "إنشاء حساب 🚀" : "دخول 🚀";
  document.getElementById('authUsername').classList.toggle('hidden', !isSignUpMode);
  document.getElementById('authToggleText').innerText = isSignUpMode ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ أنشئ حساباً جديداً";
}

// تسجيل الدخول العادي
function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  const username = document.getElementById('authUsername').value.trim();

  if(!email || !password) return alert("اكتب البريد الإلكتروني وكلمة السر!");

  if(isSignUpMode) {
    if(!username) return alert("اكتب اسمك داخل اللعبة!");
    auth.createUserWithEmailAndPassword(email, password).then(res => {
      res.user.updateProfile({ displayName: username }).then(() => initUser(res.user));
    }).catch(err => alert("خطأ: " + err.message));
  } else {
    auth.signInWithEmailAndPassword(email, password).then(res => {
      initUser(res.user);
    }).catch(err => alert("خطأ: " + err.message));
  }
}

// تسجيل الدخول بـ Google
function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then((result) => {
      initUser(result.user);
    })
    .catch((error) => {
      alert("تعذر الدخول بجوجل، اختر التسجيل العادي بالإيميل: " + error.message);
    });
}

auth.onAuthStateChanged(user => { if(user) initUser(user); });

function initUser(user) {
  currentUser = user;
  document.getElementById('userDisplay').innerText = user.displayName || user.email.split('@')[0];
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('main-menu').classList.remove('hidden');
}

function logout() {
  auth.signOut().then(() => location.reload());
}

// إنشاء والدخول للغرف
function showCreateRoomOptions() {
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('create-room-screen').classList.remove('hidden');
}

function backToMenu() {
  document.getElementById('create-room-screen').classList.add('hidden');
  document.getElementById('main-menu').classList.remove('hidden');
}

function confirmCreateRoom() {
  currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
  isHost = true;

  const category = document.getElementById('categorySelect').value;
  const spyCount = parseInt(document.getElementById('spyCountSelect').value);
  const timerSec = parseInt(document.getElementById('timerSelect').value);

  db.ref('spy_rooms/' + currentRoom).set({
    status: 'waiting',
    host: currentUser.displayName || currentUser.email.split('@')[0],
    category: category,
    spyCount: spyCount,
    timer: timerSec,
    spies: [],
    word: ''
  });

  joinRoomProcess();
}

function joinRoom() {
  currentRoom = document.getElementById('roomCodeInput').value.trim();
  if(!currentRoom) return alert("اكتب كود الغرفة!");

  db.ref('spy_rooms/' + currentRoom).once('value', snapshot => {
    if(snapshot.exists()) {
      joinRoomProcess();
    } else {
      alert("الغرفة غير موجودة!");
    }
  });
}

function joinRoomProcess() {
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('create-room-screen').classList.add('hidden');
  document.getElementById('lobby-screen').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = currentRoom;

  if(isHost) document.getElementById('host-controls').classList.remove('hidden');

  const name = currentUser.displayName || currentUser.email.split('@')[0];
  const playerRef = db.ref(`spy_rooms/${currentRoom}/players`).push();
  playerRef.set({ name: name });
  playerRef.onDisconnect().remove();

  db.ref('spy_rooms/' + currentRoom).on('value', snapshot => {
    const data = snapshot.val();
    if(!data) return;

    const players = data.players ? Object.values(data.players) : [];
    document.getElementById('playerCount').innerText = players.length;
    document.getElementById('playersContainer').innerHTML = players.map(p => 
      `<div class="player-item">👨‍🚀 ${p.name}</div>`
    ).join('');

    if(data.status === 'playing') showGameScreen(data);
    if(data.status === 'waiting') showLobbyScreen();
  });

  db.ref(`spy_rooms/${currentRoom}/messages`).on('child_added', snapshot => {
    const msg = snapshot.val();
    const chatBox = document.getElementById('chatMessages');
    const msgEl = document.createElement('div');
    msgEl.className = 'chat-msg';
    msgEl.innerHTML = `<b style="color:#38bdf8;">${msg.sender}:</b> ${msg.text}`;
    chatBox.appendChild(msgEl);
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  db.ref(`spy_rooms/${currentRoom}/votes`).on('value', snapshot => {
    updateVotesUI(snapshot.val());
  });
}

function startGame() {
  db.ref('spy_rooms/' + currentRoom).once('value', snapshot => {
    const data = snapshot.val();
    const wordList = wordsDatabase[data.category];
    const selectedWord = wordList[Math.floor(Math.random() * wordList.length)];
    const players = Object.values(data.players).map(p => p.name);

    if (players.length < 2) return alert("محتاج على الأقل لاعبين لتبدأ اللعبة!");

    let spies = [];
    let count = Math.min(data.spyCount, players.length - 1);
    while(spies.length < count) {
      let randName = players[Math.floor(Math.random() * players.length)];
      if(!spies.includes(randName)) spies.push(randName);
    }

    db.ref(`spy_rooms/${currentRoom}/messages`).remove();
    db.ref(`spy_rooms/${currentRoom}/votes`).remove();

    db.ref('spy_rooms/' + currentRoom).update({
      status: 'playing',
      word: selectedWord,
      spies: spies,
      startTime: Date.now()
    });
  });
}

function showGameScreen(data) {
  document.getElementById('lobby-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  const myName = currentUser.displayName || currentUser.email.split('@')[0];
  const isSpy = data.spies && data.spies.includes(myName);
  const roleDisplay = document.getElementById('roleDisplay');

  if(isSpy) {
    roleDisplay.innerText = "🕵️ أنت الجاسوس!\nحاول ألا تكتشف.";
    roleDisplay.className = "word-box spy-box";
  } else {
    roleDisplay.innerText = `الكلمة هي:\n${data.word}`;
    roleDisplay.className = "word-box";
  }

  const players = data.players ? Object.values(data.players) : [];
  const voteContainer = document.getElementById('voteContainer');
  voteContainer.innerHTML = players.map(p => `
    <button class="vote-btn" id="vbtn-${p.name}" onclick="castVote('${p.name}')">
      🎯 ${p.name} (<span id="vc-${p.name}">0</span>)
    </button>
  `).join('');

  if(isHost) {
    document.getElementById('resetBtn').classList.remove('hidden');
  }

  clearInterval(timerInterval);
  let duration = data.timer || 120;
  timerInterval = setInterval(() => {
    let elapsed = Math.floor((Date.now() - data.startTime) / 1000);
    let remaining = duration - elapsed;
    if (remaining <= 0) {
      clearInterval(timerInterval);
      document.getElementById('timerDisplay').innerText = "⏳ انتهى الوقت!";
      evaluateGameResult(data);
    } else {
      document.getElementById('timerDisplay').innerText = `⏳ الوقت المتبقي: ${remaining} ثانية`;
    }
  }, 1000);
}

function castVote(targetName) {
  const myName = currentUser.displayName || currentUser.email.split('@')[0];
  db.ref(`spy_rooms/${currentRoom}/votes/${myName}`).set(targetName);
}

function updateVotesUI(votesData) {
  if(!votesData) return;
  
  document.querySelectorAll('[id^="vc-"]').forEach(el => el.innerText = "0");

  let counts = {};
  Object.values(votesData).forEach(target => {
    counts[target] = (counts[target] || 0) + 1;
  });

  for(let target in counts) {
    const el = document.getElementById(`vc-${target}`);
    if(el) el.innerText = counts[target];
  }
}

function evaluateGameResult(data) {
  db.ref(`spy_rooms/${currentRoom}/votes`).once('value', snapshot => {
    const votes = snapshot.val() || {};
    let counts = {};
    Object.values(votes).forEach(target => counts[target] = (counts[target] || 0) + 1);

    let maxVotes = 0;
    let suspected = null;
    for(let p in counts) {
      if(counts[p] > maxVotes) {
        maxVotes = counts[p];
        suspected = p;
      }
    }

    const resultEl = document.getElementById('gameResult');
    if(suspected) {
      const wasSpy = data.spies && data.spies.includes(suspected);
      if(wasSpy) {
        resultEl.style.color = "#38bdf8";
        resultEl.innerText = `🎉 تم طرد (${suspected}) وكان هو الجاسوس! كسبتم الجولة!`;
      } else {
        resultEl.style.color = "#ef4444";
        resultEl.innerText = `🚨 تم طرد (${suspected}) وللأسف كان بريء! الجواسيس هم: ${data.spies.join(' ، ')}`;
      }
    } else {
      resultEl.style.color = "#ef4444";
      resultEl.innerText = `🚨 لم يتم الاتفاق على أحد! الجواسيس هم: ${data.spies.join(' ، ')}`;
    }
  });
}

function showLobbyScreen() {
  clearInterval(timerInterval);
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('lobby-screen').classList.remove('hidden');
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('gameResult').innerText = '';
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  if(!input.value.trim()) return;
  const myName = currentUser.displayName || currentUser.email.split('@')[0];
  db.ref(`spy_rooms/${currentRoom}/messages`).push({ sender: myName, text: input.value });
  input.value = '';
}

function resetGame() {
  db.ref('spy_rooms/' + currentRoom).update({ status: 'waiting' });
}
</script>
