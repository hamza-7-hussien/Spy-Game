<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 STUDIOS - لعبة الجاسوس المتقدمة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
  .card { background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  h1 { color: #38bdf8; margin-bottom: 10px; font-size: 22px; }
  input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: none; font-size: 15px; text-align: center; }
  input, select { background: #0f172a; color: white; border: 1px solid #334155; }
  button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
  button:hover { background: #0284c7; color: white; }
  .code-box { background: #334155; color: #f59e0b; font-size: 26px; font-weight: bold; letter-spacing: 3px; padding: 8px; border-radius: 8px; margin: 10px 0; }
  .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; text-align: right; margin: 10px 0; max-height: 180px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 8px; }
  .player-item { background: #334155; padding: 6px 10px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; }
  .dead { background: #7f1d1d; color: #fca5a5; text-decoration: line-through; }
  .word-box { background: #0284c7; font-size: 22px; padding: 15px; border-radius: 12px; margin: 10px 0; font-weight: bold; }
  .spy-box { background: #ef4444; }
  .vote-btn { background: #475569; color: white; margin: 4px 0; padding: 8px; border-radius: 6px; }
  .hidden { display: none; }
  .status-tag { font-size: 12px; color: #38bdf8; }
</style>
</head>
<body>

<div class="card">
  <h1>🕵️ الجاسوس - 7 STUDIOS</h1>

  <!-- شاشة البداية -->
  <div id="start-screen">
    <input type="text" id="playerName" placeholder="ادخل اسمك">
    <button onclick="createRoom()">إنشاء غرفة جديدة (حد أقصى 20)</button>
    <hr style="margin: 12px 0; border-color: #334155;">
    <input type="text" id="roomCodeInput" placeholder="ادخل كود الغرفة">
    <button onclick="joinRoom()">دخول الغرفة</button>
  </div>

  <!-- شاشة الانتظار (Lobby) -->
  <div id="lobby-screen" class="hidden">
    <h3>كود الغرفة:</h3>
    <div id="roomCodeDisplay" class="code-box">----</div>
    
    <div id="host-controls" class="hidden">
      <label>اختر الفئة:</label>
      <select id="categorySelect">
        <option value="players">⚽ لاعيبين كرة</option>
        <option value="food">🍕 أكلات ومشروبات</option>
        <option value="places">🗺️ أماكن ومعالم</option>
      </select>

      <label>عدد الجواسيس:</label>
      <select id="spyCountSelect">
        <option value="1">جاسوس واحد (1)</option>
        <option value="2">جاسوسين (2)</option>
        <option value="3">3 جواسيس</option>
        <option value="4">4 جواسيس</option>
        <option value="5">5 جواسيس</option>
      </select>

      <button onclick="startGame()">بدء اللعبة الان 🚀</button>
    </div>

    <div style="margin-top:10px;">
      <b>اللاعبين (<span id="playerCount">0</span> / 20):</b>
      <div id="playersContainer" class="player-grid"></div>
    </div>
  </div>

  <!-- شاشة اللعب والكلمة -->
  <div id="game-screen" class="hidden">
    <h2>دورك في الجولة:</h2>
    <div id="roleDisplay" class="word-box">...</div>
    
    <hr style="margin: 15px 0; border-color: #334155;">
    
    <h3>مركز التصويت والإقصاء 🗳️</h3>
    <p style="font-size:13px; color:#94a3b8; margin-bottom:8px;">صوتوا على الشخص المشكوك فيه. صاحب أغلبية الأصوات سيتم طرده!</p>
    
    <div id="voteContainer"></div>
    
    <div id="gameResult" style="margin-top:15px; font-weight:bold; font-size:18px;"></div>

    <button id="resetBtn" class="hidden" style="margin-top:15px; background:#e11d48;" onclick="resetGame()">العودة للانتظار 🔄</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD5Jpus1aRmd0xOan4gl7FETYLJMjudwHo",
  authDomain: "studios-9b8c4.firebaseapp.com",
  databaseURL: "https://studios-9b8c4-default-rtdb.firebaseio.com",
  projectId: "studios-9b8c4",
  storageBucket: "studios-9b8c4.firebasestorage.app",
  messagingSenderId: "710268925216",
  appId: "1:710268925216:web:77be520e4a1716621f5345"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const wordsDatabase = {
  players: ["محمد صلاح", "كريستيانو رونالدو", "ليونيل ميسي", "مبابي", "بنزيما", "هالانج", "شيكابالا", "معلول", "فينيسيوس", "مودريتش"],
  food: ["بيتزا", "كشري", "برجر", "ملوخية", "شاورما", "فول وطعمية", "مانجو", "حواوشي", "ورق عنب"],
  places: ["الأهرامات", "المتحف المصري", "برج القاهرة", "مكتبة الإسكندرية", "شرم الشيخ", "خان الخليلي", "الأقصر"]
};

let currentRoom = null;
let myName = "";
let isHost = false;

function createRoom() {
  myName = document.getElementById('playerName').value.trim();
  if(!myName) return alert("اكتب اسمك الأول!");

  currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
  isHost = true;

  db.ref('spy_rooms/' + currentRoom).set({
    status: 'waiting',
    host: myName,
    spies: [],
    word: '',
    votes: {},
    eliminated: {}
  });

  joinRoomProcess();
}

function joinRoom() {
  myName = document.getElementById('playerName').value.trim();
  currentRoom = document.getElementById('roomCodeInput').value.trim();

  if(!myName || !currentRoom) return alert("اكتب اسمك وكود الغرفة!");

  db.ref('spy_rooms/' + currentRoom).once('value', snapshot => {
    if(snapshot.exists()) {
      const data = snapshot.val();
      const players = data.players ? Object.values(data.players) : [];
      if(players.length >= 20) return alert("الغرفة مكتملة (20/20)!");
      joinRoomProcess();
    } else {
      alert("الغرفة غير موجودة!");
    }
  });
}

function joinRoomProcess() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('lobby-screen').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = currentRoom;

  if(isHost) document.getElementById('host-controls').classList.remove('hidden');

  const playerRef = db.ref(`spy_rooms/${currentRoom}/players`).push();
  playerRef.set({ name: myName });
  playerRef.onDisconnect().remove();

  db.ref('spy_rooms/' + currentRoom).on('value', snapshot => {
    const data = snapshot.val();
    if(!data) return;

    const players = data.players ? Object.values(data.players) : [];
    document.getElementById('playerCount').innerText = players.length;
    
    // عرض قائمة اللاعبين في اللوبي
    document.getElementById('playersContainer').innerHTML = players.map(p => 
      `<div class="player-item">👤 ${p.name}</div>`
    ).join('');

    if(data.status === 'playing') {
      showGameScreen(data);
    }
  });
}

function startGame() {
  const category = document.getElementById('categorySelect').value;
  const numSpies = parseInt(document.getElementById('spyCountSelect').value);
  const wordList = wordsDatabase[category];
  const selectedWord = wordList[Math.floor(Math.random() * wordList.length)];

  db.ref(`spy_rooms/${currentRoom}/players`).once('value', snapshot => {
    const playersObj = snapshot.val();
    const playerNames = Object.values(playersObj).map(p => p.name);

    if(playerNames.length <= numSpies) {
      return alert("عدد الجواسيس لازم يكون أقل من عدد اللعيبة المتواجدين!");
    }

    // اختيار الجواسيس عشوائياً
    let spies = [];
    while(spies.length < numSpies) {
      let randName = playerNames[Math.floor(Math.random() * playerNames.length)];
      if(!spies.includes(randName)) spies.push(randName);
    }

    db.ref('spy_rooms/' + currentRoom).update({
      status: 'playing',
      word: selectedWord,
      spies: spies,
      category: category,
      votes: {},
      eliminated: {}
    });
  });
}

function showGameScreen(data) {
  document.getElementById('lobby-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  const roleDisplay = document.getElementById('roleDisplay');
  const isSpy = data.spies && data.spies.includes(myName);
  const isEliminated = data.eliminated && data.eliminated[myName];

  if(isEliminated) {
    roleDisplay.innerText = "❌ تم إقصاؤك! أنت الآن في وضع المشاهدة.";
    roleDisplay.className = "word-box spy-box";
  } else if(isSpy) {
    roleDisplay.innerText = `🕵️ أنت جاسوس!\nالفئة هي: (${data.category === 'players' ? 'اعيبين' : data.category === 'food' ? 'أكلات' : 'أماكن'})`;
    roleDisplay.className = "word-box spy-box";
  } else {
    roleDisplay.innerText = `الكلمة هي:\n${data.word}`;
    roleDisplay.className = "word-box";
  }

  renderVotingSection(data);
  checkWinConditions(data);
}

function renderVotingSection(data) {
  const voteContainer = document.getElementById('voteContainer');
  voteContainer.innerHTML = '';

  const players = data.players ? Object.values(data.players) : [];
  const eliminated = data.eliminated || {};
  const votes = data.votes || {};

  if(eliminated[myName]) {
    voteContainer.innerHTML = "<p style='color:#fca5a5;'>لا يمكنك التصويت لأنك مقتول/مقصى.</p>";
    return;
  }

  players.forEach(p => {
    if(!eliminated[p.name] && p.name !== myName) {
      const voteCount = Object.values(votes).filter(v => v === p.name).length;
      voteContainer.innerHTML += `
        <button class="vote-btn" onclick="castVote('${p.name}')">
          تصويت ضد: ${p.name} (أصوات: ${voteCount})
        </button><br>
      `;
    }
  });
}

function castVote(targetName) {
  db.ref(`spy_rooms/${currentRoom}/votes/${myName}`).set(targetName, () => {
    evaluateVotes();
  });
}

function evaluateVotes() {
  db.ref('spy_rooms/' + currentRoom).once('value', snapshot => {
    const data = snapshot.val();
    const votes = data.votes || {};
    const players = Object.values(data.players || {});
    const eliminated = data.eliminated || {};
    
    const activePlayers = players.filter(p => !eliminated[p.name]);
    
    // لو كل اللعيبة الأحياء صوتوا
    if(Object.keys(votes).length >= activePlayers.length && activePlayers.length > 0) {
      // حصر الأصوات
      let counts = {};
      Object.values(votes).forEach(target => {
        counts[target] = (counts[target] || 0) + 1;
      });

      // معرفة من حصل على أعلى أصوات
      let maxVotes = 0;
      let eliminatedPlayer = null;
      for(let p in counts) {
        if(counts[p] > maxVotes) {
          maxVotes = counts[p];
          eliminatedPlayer = p;
        }
      }

      if(eliminatedPlayer) {
        alert(`تم إقصاء اللاعب: ${eliminatedPlayer} بأعلى نسبة تصويت!`);
        db.ref(`spy_rooms/${currentRoom}/eliminated/${eliminatedPlayer}`).set(true);
        db.ref(`spy_rooms/${currentRoom}/votes`).remove(); // إعادة ضبط الأصوات للجولة التالية
      }
    }
  });
}

function checkWinConditions(data) {
  const players = Object.values(data.players || {});
  const eliminated = data.eliminated || {};
  const spies = data.spies || [];

  const activePlayers = players.filter(p => !eliminated[p.name]).map(p => p.name);
  const activeSpies = activePlayers.filter(p => spies.includes(p));
  const activeCitizens = activePlayers.filter(p => !spies.includes(p));

  const resultDiv = document.getElementById('gameResult');

  // فوز المواطنين: تم إقصاء جميع الجواسيس
  if(activeSpies.length === 0 && spies.length > 0) {
    resultDiv.innerHTML = "<span style='color:#10b981;'>🎉 فاز المواطنون! تم كشف جميع الجواسيس!</span>";
    if(isHost) document.getElementById('resetBtn').classList.remove('hidden');
  } 
  // فوز الجواسيس: عدد الجواسيس أصبح أسطوريًا أو مساوياً للمواطنين
  else if(activeSpies.length >= activeCitizens.length && activeCitizens.length > 0) {
    resultDiv.innerHTML = `<span style='color:#ef4444;'>🕵️ فاز الجواسيس! سطروا على المدينة! الجواسيس هم: ${spies.join(', ')}</span>`;
    if(isHost) document.getElementById('resetBtn').classList.remove('hidden');
  } else {
    resultDiv.innerHTML = `<span style='color:#38bdf8;'>المتبقين أحياء: ${activePlayers.length} (جواسيس متبقيين: ${activeSpies.length})</span>`;
  }
}

function resetGame() {
  db.ref('spy_rooms/' + currentRoom).update({
    status: 'waiting',
    spies: [],
    word: '',
    votes: {},
    eliminated: {}
  });
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('lobby-screen').classList.remove('hidden');
  document.getElementById('resetBtn').classList.add('hidden');
}
</script>
</body>
</html>
