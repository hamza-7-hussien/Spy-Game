<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPY STATION 🚀</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap');

  :root {
    --bg-primary: #030712;
    --accent-blue: #38bdf8;
    --accent-purple: #818cf8;
    --danger-red: #ef4444;
    --card-bg: rgba(17, 24, 39, 0.85);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Orbitron', 'Cairo', sans-serif; transition: all 0.3s ease; }
  
  body { 
    background: var(--bg-primary); 
    color: #f3f4f6; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    padding: 15px; 
    overflow-x: hidden;
    background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #030712 100%);
  }

  .card { 
    background: var(--card-bg); 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    backdrop-filter: blur(16px);
    border-radius: 24px; 
    padding: 28px; 
    width: 100%; 
    max-width: 600px; 
    text-align: center; 
    box-shadow: 0 0 50px rgba(56, 189, 248, 0.15);
    position: relative;
    animation: fadeIn 0.5s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo-title {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }

  input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: none; font-size: 14px; text-align: center; outline: none; }
  input, select { background: #0b0f19; color: white; border: 1px solid #1f2937; }
  input:focus, select:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

  button { background: linear-gradient(135deg, var(--accent-blue), #3b82f6); color: #030712; font-weight: 700; cursor: pointer; }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); }

  .btn-secondary { background: #1f2937; color: white; }
  .btn-danger { background: linear-gradient(135deg, var(--danger-red), #dc2626); color: white; }

  /* Custom Avatar Display */
  .avatar-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-blue); }
  .avatar-preview { width: 80px; height: 80px; border-radius: 50%; margin: 10px auto; border: 2px dashed var(--accent-blue); display: block; object-fit: cover; }

  .player-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; max-height: 200px; overflow-y: auto; background: #0b0f19; padding: 10px; border-radius: 12px; }
  .player-item { background: #111827; padding: 8px 12px; border-radius: 12px; border: 1px solid #1f2937; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .chat-box { background: #0b0f19; border-radius: 12px; border: 1px solid #1f2937; height: 120px; overflow-y: auto; padding: 10px; text-align: left; font-size: 13px; margin: 10px 0; }
  .chat-msg { background: #111827; padding: 6px 10px; border-radius: 8px; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }

  .hidden { display: none !important; }

  /* Toast Notification System */
  #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
  .toast { background: #111827; border-left: 4px solid var(--accent-blue); color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: slideIn 0.3s forwards; }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
</style>
</head>
<body>

<div id="toast-container"></div>

<div class="card">
  <div class="logo-container" style="margin-bottom:15px;">
    <div class="logo-title">🛸 SPY STATION</div>
    <div style="font-size: 10px; color: #94a3b8; letter-spacing: 3px;">MULTIPLAYER SPACE EDITION</div>
  </div>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <h3 id="txt-login">Login</h3>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="Password">
    <input type="text" id="authUsername" placeholder="Unique Username" class="hidden">
    <button onclick="handleAuth()" id="btn-auth">Login 🚀</button>
    <div onclick="toggleAuthMode()" style="color: var(--accent-blue); cursor: pointer; font-size: 12px; margin-top: 8px;" id="txt-toggleAuth">Don't have an account? Sign Up</div>
  </div>

  <!-- MAIN MENU -->
  <div id="main-menu" class="hidden">
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:15px;">
      <img id="userAvatarDisplay" class="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=astro" alt="avatar">
      <span id="userDisplay" style="font-weight:bold; color:var(--accent-blue);">Player</span>
    </div>
    
    <button onclick="showCreateRoomOptions()" id="btn-createRoomMenu">Create Room 🛠️</button>
    <input type="text" id="roomCodeInput" placeholder="Room Code">
    <button class="btn-secondary" onclick="joinRoom()" id="btn-joinRoom">Join Room 🛰️</button>
    
    <div style="display:flex; gap:10px; margin-top:15px;">
      <button class="btn-secondary" onclick="showSettings()" id="btn-settings">Settings ⚙️</button>
      <button class="btn-danger" onclick="logout()" id="btn-logout">Logout</button>
    </div>
  </div>

  <!-- CREATE ROOM OPTIONS -->
  <div id="create-room-screen" class="hidden">
    <h3 id="txt-roomSettings">Room Settings ⚙️</h3>
    <select id="categorySelect">
      <option value="players">⚽ Football Players</option>
      <option value="food">🍕 Food & Drinks</option>
      <option value="places">🗺️ Famous Places</option>
    </select>
    <label style="font-size:11px; color:#94a3b8;">Spies / Imposters (1 - 5):</label>
    <input type="number" id="spyCountSelect" min="1" max="5" value="1">
    <label style="font-size:11px; color:#94a3b8;">Round Time (Seconds):</label>
    <input type="number" id="roundTimerSelect" value="180">
    <label style="font-size:11px; color:#94a3b8;">Clue Input Time (Seconds):</label>
    <input type="number" id="clueTimerSelect" value="30">

    <button onclick="confirmCreateRoom()" id="btn-confirmCreate">Create & Launch 🚀</button>
    <button class="btn-secondary" onclick="backToMenu()" id="btn-cancelCreate">Cancel</button>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-screen" class="hidden">
    <h3 id="txt-settingsTitle">Profile & Settings ⚙️</h3>
    <img id="settingAvatarPreview" class="avatar-preview" src="" alt="preview">
    <input type="text" id="settingAvatarUrl" placeholder="Avatar Image URL" onchange="updateAvatarPreview()">
    <input type="text" id="settingUsername" placeholder="Change Username">
    
    <label style="font-size:11px; color:#94a3b8;">Language / اللغة:</label>
    <select id="languageSelect" onchange="changeLanguage()">
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>

    <label style="font-size:11px; color:#94a3b8;">Sound Effects Volume:</label>
    <input type="range" id="soundVolume" min="0" max="1" step="0.1" value="0.5" onchange="updateVolume()">

    <button onclick="saveSettings()" id="btn-saveSettings">Save Changes 💾</button>
    <button class="btn-secondary" onclick="backToMenu()">Back</button>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobby-screen" class="hidden">
    <p id="txt-lobbyCode">Station Code:</p>
    <div id="roomCodeDisplay" style="font-size:24px; color:var(--accent-blue); font-weight:bold; margin:10px 0;">----</div>
    
    <div id="host-controls" class="hidden">
      <button onclick="startGame()" id="btn-startGame">Start Game 🚀 (Min 3 Players)</button>
    </div>

    <div style="margin-top:12px;">
      <b><span id="txt-playersList">Astronauts</span> (<span id="playerCount">0</span>):</b>
      <div id="playersContainer" class="player-grid"></div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="hidden">
    <div id="timerDisplay" style="font-size:16px; color:var(--danger-red); font-weight:bold;">⏳ Time: --</div>
    <div id="roleDisplay" style="font-size:20px; font-weight:bold; margin:15px 0; background:#0b0f19; padding:15px; border-radius:12px;">...</div>

    <!-- Clue Phase -->
    <div id="clue-phase">
      <div id="clueTimerDisplay" style="color:var(--accent-blue); font-size:13px;">30s to write your clue!</div>
      <input type="text" id="clueInput" placeholder="Write your clue...">
      <button onclick="submitClue()" id="btn-submitClue">Submit Clue 📝</button>
    </div>

    <!-- Chat / Hints -->
    <div class="chat-box" id="chatMessages"></div>

    <button class="btn-danger" style="margin-top:10px;" onclick="triggerVotingPhase()" id="btn-callVote">Call Emergency Vote 🗳️</button>

    <!-- Vote Overlay -->
    <div id="voteModal" class="hidden" style="margin-top:15px; background:#0b0f19; padding:15px; border-radius:12px;">
      <h4 id="txt-voteTitle">Vote to Eject Imposter</h4>
      <div id="voteContainer" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;"></div>
    </div>

    <div id="gameResult" style="margin-top:10px; font-weight:bold; font-size:14px;"></div>

    <!-- Spy Guess Phase -->
    <div id="spyGuessPhase" class="hidden" style="margin-top:10px;">
      <input type="text" id="spyGuessInput" placeholder="Spy: Guess the secret word!">
      <button onclick="submitSpyGuess()">Submit Guess 🎯</button>
    </div>

    <button id="resetBtn" class="hidden btn-secondary" style="margin-top:15px;" onclick="resetGameToLobby()">Return to Lobby 🔄</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmOPqQ1AV9YEJ4wU7jjW9_kIy4Gbby8Zs",
  authDomain: "spy-game-4f727.firebaseapp.com",
  databaseURL: "https://spy-game-4f727-default-rtdb.firebaseio.com",
  projectId: "spy-game-4f727",
  storageBucket: "spy-game-4f727.firebasestorage.app",
  messagingSenderId: "567560688609",
  appId: "1:567560688609:web:9a85e21fcf318e888d78a0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// Sound System
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let soundVol = 0.5;

function playSound(freq, type = 'sine', duration = 0.15) {
  if (soundVol <= 0) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = soundVol;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

// UI Custom Toast
function showToast(msg) {
  playSound(600, 'triangle', 0.1);
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerText = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// Translations
const i18n = {
  en: {
    login: "Login", signup: "Sign Up", authBtn: "Login 🚀", createRoom: "Create Room 🛠️", joinRoom: "Join Room 🛰️",
    settings: "Settings ⚙️", minPlayers: "Requires at least 3 players!", roomCodeReq: "Enter Room Code!",
    spyWin: "Spies won the game!", crewWin: "Crewmates won the game!"
  },
  ar: {
    login: "تسجيل الدخول", signup: "إنشاء حساب", authBtn: "دخول 🚀", createRoom: "إنشاء غرفة 🛠️", joinRoom: "الانضمام لغرفة 🛰️",
    settings: "الإعدادات ⚙️", minPlayers: "يجب توفر 3 لاعبين على الأقل!", roomCodeReq: "ادخل كود الغرفة!",
    spyWin: "فاز الجواسيس بالجولة!", crewWin: "فاز الطاقم بالجولة!"
  }
};
let currentLang = 'en';

function changeLanguage() {
  currentLang = document.getElementById('languageSelect').value;
  const t = i18n[currentLang];
  document.getElementById('txt-login').innerText = t.login;
  document.getElementById('btn-createRoomMenu').innerText = t.createRoom;
  document.getElementById('btn-joinRoom').innerText = t.joinRoom;
  document.getElementById('btn-settings').innerText = t.settings;
}

// Global Variables
let currentUser = null;
let currentRoom = null;
let isHost = false;
let isSignUpMode = false;
let timerInterval = null;

const wordsDB = {
  players: ["Messi", "Ronaldo", "Salah", "Mbappe", "Neymar"],
  food: ["Pizza", "Burger", "Sushi", "Pasta", "Shawarma"],
  places: ["Pyramids", "Eiffel Tower", "Dubai", "London", "Tokyo"]
};

// Auth Handlers
function toggleAuthMode() {
  isSignUpMode = !isSignUpMode;
  document.getElementById('auth-screen').querySelector('h3').innerText = isSignUpMode ? "Sign Up" : "Login";
  document.getElementById('authUsername').classList.toggle('hidden', !isSignUpMode);
}

function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  const username = document.getElementById('authUsername').value.trim();

  if(!email || !password) return showToast("Please fill all fields!");

  if(isSignUpMode) {
    if(!username) return showToast("Username is required!");
    db.ref('usernames/' + username.toLowerCase()).once('value', snap => {
      if(snap.exists()) return showToast("Username is already taken!");

      auth.createUserWithEmailAndPassword(email, password).then(res => {
        const defaultAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${username}`;
        res.user.updateProfile({ displayName: username, photoURL: defaultAvatar }).then(() => {
          db.ref('usernames/' + username.toLowerCase()).set(res.user.uid);
          initUser(res.user);
        });
      }).catch(err => showToast(err.message));
    });
  } else {
    auth.signInWithEmailAndPassword(email, password).then(res => initUser(res.user)).catch(err => showToast(err.message));
  }
}

auth.onAuthStateChanged(user => { if(user) initUser(user); });

function initUser(user) {
  currentUser = user;
  document.getElementById('userDisplay').innerText = user.displayName || "Astronaut";
  document.getElementById('userAvatarDisplay').src = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=astro`;
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('main-menu').classList.remove('hidden');
}

function logout() { auth.signOut().then(() => location.reload()); }

// Navigation
function showCreateRoomOptions() { document.getElementById('main-menu').classList.add('hidden'); document.getElementById('create-room-screen').classList.remove('hidden'); }
function backToMenu() { 
  document.getElementById('create-room-screen').classList.add('hidden'); 
  document.getElementById('settings-screen').classList.add('hidden'); 
  document.getElementById('main-menu').classList.remove('hidden'); 
}
function showSettings() {
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('settings-screen').classList.remove('hidden');
  document.getElementById('settingUsername').value = currentUser.displayName || '';
  document.getElementById('settingAvatarUrl').value = currentUser.photoURL || '';
  document.getElementById('settingAvatarPreview').src = currentUser.photoURL || '';
}

function updateAvatarPreview() { document.getElementById('settingAvatarPreview').src = document.getElementById('settingAvatarUrl').value; }
function updateVolume() { soundVol = parseFloat(document.getElementById('soundVolume').value); }

function saveSettings() {
  const newName = document.getElementById('settingUsername').value.trim();
  const newAvatar = document.getElementById('settingAvatarUrl').value.trim();

  if(newName && newName !== currentUser.displayName) {
    db.ref('usernames/' + newName.toLowerCase()).once('value', snap => {
      if(snap.exists()) return showToast("Username taken!");
      currentUser.updateProfile({ displayName: newName, photoURL: newAvatar }).then(() => {
        initUser(currentUser);
        showToast("Profile Updated!");
        backToMenu();
      });
    });
  } else {
    currentUser.updateProfile({ photoURL: newAvatar }).then(() => {
      initUser(currentUser);
      showToast("Profile Updated!");
      backToMenu();
    });
  }
}

// Room Logic
function confirmCreateRoom() {
  currentRoom = Math.floor(10000 + Math.random() * 90000).toString();
  isHost = true;

  db.ref('spy_rooms/' + currentRoom).set({
    status: 'waiting',
    host: currentUser.displayName,
    category: document.getElementById('categorySelect').value,
    spyCount: parseInt(document.getElementById('spyCountSelect').value),
    roundTimer: parseInt(document.getElementById('roundTimerSelect').value),
    clueTimer: parseInt(document.getElementById('clueTimerSelect').value)
  });

  joinRoomProcess();
}

function joinRoom() {
  currentRoom = document.getElementById('roomCodeInput').value.trim();
  if(!currentRoom) return showToast(i18n[currentLang].roomCodeReq);

  db.ref('spy_rooms/' + currentRoom).once('value', snap => {
    if(snap.exists()) joinRoomProcess();
    else showToast("Room not found!");
  });
}

function joinRoomProcess() {
  document.getElementById('main-menu').classList.add('hidden');
  document.getElementById('create-room-screen').classList.add('hidden');
  document.getElementById('lobby-screen').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').innerText = currentRoom;

  const playerRef = db.ref(`spy_rooms/${currentRoom}/players/${currentUser.uid}`);
  playerRef.set({
    name: currentUser.displayName,
    avatar: currentUser.photoURL,
    isHost: isHost
  });
  playerRef.onDisconnect().remove();

  db.ref('spy_rooms/' + currentRoom).on('value', snap => {
    const data = snap.val();
    if(!data) return;

    if(data.host === currentUser.displayName) {
      isHost = true;
      document.getElementById('host-controls').classList.remove('hidden');
    }

    const players = data.players ? Object.values(data.players) : [];
    document.getElementById('playerCount').innerText = players.length;
    
    document.getElementById('playersContainer').innerHTML = players.map(p => `
      <div class="player-item">
        <div style="display:flex; align-items:center; gap:6px;">
          <img class="avatar-img" style="width:28px; height:28px;" src="${p.avatar}" alt="a">
          <span>${p.name} ${p.isHost ? '👑' : ''}</span>
        </div>
        ${isHost && p.name !== currentUser.displayName ? `<button class="btn-danger" style="width:auto; padding:2px 6px; font-size:10px;" onclick="kickPlayer('${p.name}')">X</button>` : ''}
      </div>
    `).join('');

    if(data.status === 'playing') showGameScreen(data);
    if(data.status === 'waiting') showLobbyScreen();
  });

  // Listen for Messages
  db.ref(`spy_rooms/${currentRoom}/messages`).on('child_added', snap => {
    const msg = snap.val();
    const chatBox = document.getElementById('chatMessages');
    chatBox.innerHTML += `<div class="chat-msg"><img class="avatar-img" style="width:20px; height:20px;" src="${msg.avatar}"><b>${msg.sender}:</b> ${msg.text}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

function kickPlayer(name) {
  db.ref(`spy_rooms/${currentRoom}/players`).once('value', snap => {
    snap.forEach(child => {
      if(child.val().name === name) child.ref.remove();
    });
  });
}

function startGame() {
  db.ref(`spy_rooms/${currentRoom}/players`).once('value', snap => {
    const playersArr = Object.values(snap.val());
    if(playersArr.length < 3) return showToast(i18n[currentLang].minPlayers);

    db.ref('spy_rooms/' + currentRoom).once('value', roomSnap => {
      const data = roomSnap.val();
      const wordList = wordsDB[data.category];
      const selectedWord = wordList[Math.floor(Math.random() * wordList.length)];
      
      let spies = [];
      let count = Math.min(data.spyCount, playersArr.length - 1);
      while(spies.length < count) {
        let randPlayer = playersArr[Math.floor(Math.random() * playersArr.length)].name;
        if(!spies.includes(randPlayer)) spies.push(randPlayer);
      }

      db.ref(`spy_rooms/${currentRoom}`).update({
        status: 'playing',
        word: selectedWord,
        spies: spies,
        startTime: Date.now()
      });
    });
  });
}

function showGameScreen(data) {
  document.getElementById('lobby-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  const isSpy = data.spies && data.spies.includes(currentUser.displayName);
  document.getElementById('roleDisplay').innerText = isSpy ? "🕵️ YOU ARE THE SPY!" : `Word: ${data.word}`;
  document.getElementById('roleDisplay').style.color = isSpy ? "var(--danger-red)" : "var(--accent-blue)";

  if(isHost) document.getElementById('resetBtn').classList.remove('hidden');
}

function submitClue() {
  const clue = document.getElementById('clueInput').value.trim();
  if(!clue) return;
  db.ref(`spy_rooms/${currentRoom}/messages`).push({
    sender: currentUser.displayName,
    avatar: currentUser.photoURL,
    text: `💡 Clue: ${clue}`
  });
  document.getElementById('clue-phase').classList.add('hidden');
}

function triggerVotingPhase() {
  document.getElementById('voteModal').classList.remove('hidden');
  db.ref(`spy_rooms/${currentRoom}/players`).once('value', snap => {
    const players = Object.values(snap.val());
    document.getElementById('voteContainer').innerHTML = players.map(p => `
      <button class="btn-secondary" onclick="castVote('${p.name}')">🎯 ${p.name}</button>
    `).join('');
  });
}

function castVote(target) {
  db.ref(`spy_rooms/${currentRoom}/votes/${currentUser.displayName}`).set(target);
  document.getElementById('voteModal').classList.add('hidden');
  showToast("Vote Submitted!");
}

function submitSpyGuess() {
  const guess = document.getElementById('spyGuessInput').value.trim();
  db.ref('spy_rooms/' + currentRoom).once('value', snap => {
    const word = snap.val().word;
    if(guess.toLowerCase() === word.toLowerCase()) {
      showToast("Spy Guessed Correctly! Spies Win! 🎉");
    } else {
      showToast("Wrong Guess! Crewmates Win! 🚀");
    }
  });
}

function resetGameToLobby() {
  db.ref('spy_rooms/' + currentRoom).update({ status: 'waiting' });
}

function showLobbyScreen() {
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('lobby-screen').classList.remove('hidden');
}
</script>
</body>
</html>
