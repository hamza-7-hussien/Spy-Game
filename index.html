<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Station - محطة الجواسيس</title>
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-color: #58a6ff;
            --danger-color: #f85149;
            --success-color: #238636;
            --text-color: #c9d1d9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        button.danger { background-color: var(--danger-color); }
        button.success { background-color: var(--success-color); }
        button:hover { opacity: 0.9; }
        .hidden { display: none !important; }
        .player-list { text-align: right; margin: 15px 0; max-height: 150px; overflow-y: auto; }
        .player-item { padding: 5px; border-bottom: 1px solid #30363d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Spy Station 🚀</h1>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <input type="text" id="username" placeholder="اكتب اسمك المستعار..." maxlength="15">
        <button onclick="joinGame()">دخول اللعبة</button>
    </div>

    <!-- شاشة اللوبي (Lobby) -->
    <div id="lobby-screen" class="hidden">
        <h3 id="room-title">الغرفة الرئيسية</h3>
        <div class="player-list" id="players-list-container"></div>
        <div id="host-controls" class="hidden">
            <button class="success" onclick="startGame()">بدء الجولة</button>
        </div>
        <p id="waiting-text">انتظار باقي اللاعبين انضمامهم وبدء الهوست...</p>
    </div>

    <!-- شاشة اللعب والمهام -->
    <div id="game-screen" class="hidden">
        <h2 id="role-display">دورك: جاري التحميل...</h2>
        <p>مكان المهمة/الكلمة: <span id="secret-word" style="color: var(--accent-color); font-weight: bold;">---</span></p>
        <div style="font-size: 20px; margin: 15px 0;">الوقت المتبقي: <span id="timer-display">--</span> ثانية</div>
        <button id="emergency-btn" class="danger hidden" onclick="triggerEmergency()">🚨 تصويت طارئ</button>
    </div>

    <!-- شاشة التصويت -->
    <div id="vote-screen" class="hidden">
        <h2>وقت التصويت! من هو الجاسوس؟</h2>
        <div class="player-list" id="vote-list-container"></div>
        <p>ينتهي التصويت خلال: <span id="vote-timer">--</span> ثانية</p>
    </div>
</div>

<script>
    // إعدادات Firebase (استبدل القيم ببيانات مشروعك الفعلي)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = "";
    let myId = "user_" + Math.random().toString(36).substr(2, 9);
    let currentRoomId = "main_room";
    let isHost = false;
    let timerInterval = null;

    function joinGame() {
        const nameInput = document.getElementById("username").value.trim();
        if (!nameInput) {
            alert("برجاء إدخال اسم صحيح!");
            return;
        }
        myName = nameInput;
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("lobby-screen").classList.remove("hidden");

        const playerRef = db.ref(`rooms/${currentRoomId}/players/${myId}`);
        playerRef.set({ name: myName, joinedAt: firebase.database.ServerValue.TIMESTAMP, isAlive: true });
        playerRef.onDisconnect().remove();

        listenToRoom();
    }

    function listenToRoom() {
        db.ref(`rooms/${currentRoomId}`).on("value", (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // 1. التحقق من الهوست والتوليد التلقائي عند خروج الهوست
            const players = data.players || {};
            const playerIds = Object.keys(players);
            if (playerIds.length > 0) {
                const firstPlayerId = playerIds.sort((a, b) => players[a].joinedAt - players[b].joinedAt)[0];
                if (firstPlayerId === myId) {
                    if (!isHost) {
                        isHost = true;
                        document.getElementById("host-controls").classList.remove("hidden");
                        document.getElementById("waiting-text").classList.add("hidden");
                    }
                } else {
                    isHost = false;
                    document.getElementById("host-controls").classList.add("hidden");
                    document.getElementById("waiting-text").classList.remove("hidden");
                }
            }

            // عرض قائمة اللاعبين
            let htmlList = "";
            for (let id in players) {
                htmlList += `<div class="player-item">${players[id].name} ${id === firstPlayerId ? '(هوست)' : ''}</div>`;
            }
            document.getElementById("players-list-container").innerHTML = htmlList;

            // 2. إدارة شاشات اللعب بناءً على حالة اللعبة في السيرفر
            if (data.gameState === "playing") {
                document.getElementById("lobby-screen").classList.add("hidden");
                document.getElementById("vote-screen").classList.add("hidden");
                document.getElementById("game-screen").classList.remove("hidden");

                // عرض الدور والكلمة السرية
                const myData = players[myId];
                if (myData) {
                    if (myData.isSpy) {
                        document.getElementById("role-display").innerText = "دورك: 🕵️‍♂️ أنت الجاسوس!";
                        document.getElementById("secret-word").innerText = "اكتشف المكان من حديث الآخرين!";
                    } else {
                        document.getElementById("role-display").innerText = "دورك: 🛡️ عضو في الطاقم";
                        document.getElementById("secret-word").innerText = data.secretWord || "---";
                    }
                }

                // إدارة العداد الزمني الموحد وتفعيل زر الطوارئ بعد نصف الوقت
                syncTimer(data.roundEndTime, () => {
                    if (isHost) {
                        db.ref(`rooms/${currentRoomId}`).update({ gameState: "voting", voteEndTime: Date.now() + 15000 });
                    }
                }, (timeLeft, totalTime) => {
                    document.getElementById("timer-display").innerText = timeLeft;
                    // زر الطوارئ يظهر بعد مرور نصف الوقت
                    if (timeLeft <= totalTime / 2) {
                        document.getElementById("emergency-btn").classList.remove("hidden");
                    }
                });

            } else if (data.gameState === "voting") {
                document.getElementById("lobby-screen").classList.add("hidden");
                document.getElementById("game-screen").classList.add("hidden");
                document.getElementById("vote-screen").classList.remove("hidden");
                document.getElementById("emergency-btn").classList.add("hidden");

                // عرض قائمة التصويت
                let voteHtml = "";
                for (let id in players) {
                    if (players[id].isAlive && id !== myId) {
                        voteHtml += `<button onclick="castVote('${id}')">تصويت ضد ${players[id].name}</button>`;
                    }
                }
                document.getElementById("vote-list-container").innerHTML = voteHtml;

                syncTimer(data.voteEndTime, () => {
                    if (isHost) processVoteResults(data);
                }, (timeLeft) => {
                    document.getElementById("vote-timer").innerText = timeLeft;
                });

            } else {
                // العودة للوبي
                document.getElementById("game-screen").classList.add("hidden");
                document.getElementById("vote-screen").classList.add("hidden");
                document.getElementById("lobby-screen").classList.remove("hidden");
            }
        });
    }

    // دالة بدء اللعبة (للهوست فقط)
    function startGame() {
        db.ref(`rooms/${currentRoomId}/players`).once("value", (snapshot) => {
            const players = snapshot.val();
            const pIds = Object.keys(players);
            if (pIds.length < 3) {
                alert("يجب وجود 3 لاعبين على الأقل لبدء اللعبة!");
                return;
            }

            // اختيار جاسوس عشوائي
            const randomSpyId = pIds[Math.floor(Math.random() * pIds.length)];
            let updates = {};
            
            for (let id in players) {
                updates[`players/${id}/isSpy`] = (id === randomSpyId);
                updates[`players/${id}/hasVoted`] = false;
            }

            const words = ["المحطة الفضائية", "ملعب كرة القدم", "المطعم", "المركبة الفضائية"];
            updates["secretWord"] = words[Math.floor(Math.random() * words.length)];
            updates["gameState"] = "playing";
            updates["roundEndTime"] = Date.now() + 45000; // 45 ثانية للجولة

            db.ref(`rooms/${currentRoomId}`).update(updates);
        });
    }

    // تفعيل التصويت الطارئ
    function triggerEmergency() {
        document.getElementById("emergency-btn").classList.add("hidden");
        db.ref(`rooms/${currentRoomId}`).update({
            gameState: "voting",
            voteEndTime: Date.now() + 15000
        });
    }

    // تسجيل التصويت
    function castVote(targetId) {
        db.ref(`rooms/${currentRoomId}/players/${myId}/hasVoted`).set(true);
        db.ref(`rooms/${currentRoomId}/votes/${targetId}`).transaction((currentVotes) => {
            return (currentVotes || 0) + 1;
        });
        document.getElementById("vote-screen").classList.add("hidden");
        alert("تم تسجيل صوتك بنجاح!");
    }

    // معالجة نتائج التصويت (للهوست بدقة)
    function processVoteResults(data) {
        const votes = data.votes || {};
        const players = data.players || {};
        
        let maxVotes = 0;
        let exiledId = null;

        for (let id in votes) {
            if (votes[id] > maxVotes) {
                maxVotes = votes[id];
                exiledId = id;
            }
        }

        let updates = { "votes": null };

        if (exiledId && players[exiledId]) {
            if (players[exiledId].isSpy) {
                alert(`لقد تم طرد الجاسوس ${players[exiledId].name}! الطاقم يفوز! 🎉`);
                updates["gameState"] = "lobby";
            } else {
                alert(`تم طرد ${players[exiledId].name} ولكنه لم يكن الجاسوس! (شخص بريء) ❌. تستمر اللعبة!`);
                updates[`players/${exiledId}/isAlive`] = false;
                updates["gameState"] = "lobby";
            }
        } else {
            alert("انتهى الوقت ولم يتم طرد أحد لتعادل الأصوات.");
            updates["gameState"] = "lobby";
        }

        db.ref(`rooms/${currentRoomId}`).update(updates);
    }

    // توحيد المزامنة للعدادات الزمنية
    function syncTimer(endTime, onFinish, onTick) {
        if (timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            const timeLeft = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
            onTick(timeLeft, 45); // 45 مثالاً لإجمالي وقت الجولة

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                onFinish();
            }
        }, 1000);
    }
</script>

</body>
</html>
